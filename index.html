
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitale Maschinenprüfung - Kontrollliste</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #1a202c;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --green: #10b981;
            --green-hover: #059669;
            --yellow: #d97706;
            --yellow-bg: #fef3c7;
            --red: #ef4444;
            --red-hover: #dc2626;
            --gray: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 { font-size: 1.5rem; }
        h2 { font-size: 1.2rem; margin-bottom: 10px; }

        .screen {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .screen.active { display: flex; }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn-green { background-color: var(--green); }
        .btn-green:hover { background-color: var(--green-hover); }
        .btn-red { background-color: var(--red); }
        .btn-secondary { background-color: var(--gray); }
        .btn-outline { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-fix { background-color: var(--yellow); color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #4a5568;
        }

        input, select, textarea {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
        }

        .checkbox-group {
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 8px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        .bg-section-title {
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 6px;
            color: var(--primary);
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 3px;
        }

        .info-card {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .check-item-card {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: #fff;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .action-buttons .btn { flex: 1; padding: 18px; font-size: 1.2rem; }

        .order-card {
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }

        .badge-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            color: white;
        }
        .badge-green { background-color: var(--green); }
        .badge-yellow { background-color: var(--yellow); }
        .badge-red { background-color: var(--red); }

        .result-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-item {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
        }
        .result-item.ok { background-color: #ecfdf5; border-left: 4px solid var(--green); }
        .result-item.fixed { background-color: #fef3c7; border-left: 4px solid var(--yellow); }
        .result-item.nok { background-color: #fef2f2; border-left: 4px solid var(--red); }

        @media print {
            body { background: white; padding: 0; }
            .app-container { box-shadow: none; border: none; max-width: 100%; width: 100%; }
            header, .btn, input, select, textarea, .progress-bar-container, .action-buttons, .btn-fix { display: none !important; }
            .screen { display: none !important; }
            #screen-archive-detail.active, #screen-final.active { display: block !important; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>📋 Maschinenprüfung Kontrollliste</h1>
    </header>

    <!-- 1. HAUPTMENÜ -->
    <div id="screen-home" class="screen active">
        <button class="btn" onclick="goToScreen('screen-new-order')">➕ Prüfauftrag anlegen / ERP Daten eingeben</button>
        <button class="btn btn-green" onclick="goToScreen('screen-orders')">🛠️ Werkstatt / Offene Prüfungen</button>
        <button class="btn btn-secondary" onclick="goToScreen('screen-archive')">📜 Archiv / Abgeschlossene Protokolle</button>
    </div>

    <!-- 2. AUFTRAG ANLEGEN -->
    <div id="screen-new-order" class="screen">
        <h2>ERP-Daten & Spezifikationen eingeben</h2>
        
        <div class="form-group">
            <label for="order-no">📌 Auftragsnummer</label>
            <input type="text" id="order-no" placeholder="z. B. 104523">
        </div>
        <div class="form-group">
            <label for="order-type">Maschinentyp / Modell</label>
            <input type="text" id="order-type" placeholder="z. B. SLE">
        </div>
        <div class="form-group">
            <label for="order-serial">Seriennummer</label>
            <input type="text" id="order-serial" placeholder="z. B. SLE0001">
        </div>

        <div class="form-group">
            <label for="order-pipe">Rohrlänge (Händische Eingabe)</label>
            <input type="text" id="order-pipe" placeholder="z. B. 435 cm oder 4,25 m">
        </div>
        <div class="form-group">
            <label for="order-axis">Achse / Spezifikation</label>
            <input type="text" id="order-axis" placeholder="z. B. Achse Typ A-400">
        </div>
        <div class="form-group">
            <label for="order-kw">Motor-Leistung / Typ</label>
            <input type="text" id="order-kw" placeholder="z. B. 5.5 kW">
        </div>

        <div class="form-group">
            <label for="order-comment">💬 Besondere Hinweise / Kommentar für Werkstatt</label>
            <textarea id="order-comment" rows="2" placeholder="z. B. Sonderausstattung beachten..."></textarea>
        </div>

        <hr style="border: 0.5px solid var(--border-color); margin: 5px 0;">
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <label><b>Prüfpunkte individuell auswählen:</b></label>
            <div style="display: flex; gap: 5px;">
                <button type="button" class="btn-outline" style="padding: 4px 8px; font-size: 0.75rem; border-radius: 4px;" onclick="toggleAllCheckboxes(true)">Alle an</button>
                <button type="button" class="btn-outline" style="padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; color: var(--red); border-color: var(--red);" onclick="toggleAllCheckboxes(false)">Alle aus</button>
            </div>
        </div>

        <div id="checklist-selection-container" style="max-height: 300px; overflow-y: auto; padding-right: 5px; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; background: #fafafa;"></div>

        <button class="btn btn-green" onclick="createOrder()">Prüfauftrag für Werkstatt freigeben ▶</button>
        <button class="btn btn-secondary" onclick="goToScreen('screen-home')">Abbrechen</button>
    </div>

    <!-- 3. AUFTRAGSLISTE -->
    <div id="screen-orders" class="screen">
        <h2>Offene Prüfungen (Werkstatt)</h2>
        <div id="orders-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
        <button class="btn btn-secondary" onclick="goToScreen('screen-home')" style="margin-top: 10px;">Zurück</button>
    </div>

    <!-- 4. PRÜFUNG DURCHFÜHREN -->
    <div id="screen-inspection" class="screen">
        <div class="info-card" id="inspection-info"></div>
        
        <div>
            <div style="display: flex; justify-content: space-between; font-weight: bold;">
                <span>Fortschritt</span>
                <span id="progress-text">0 / 0</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="check-item-card">
            <h3 id="check-step">Prüfpunkt</h3>
            <p id="check-text" style="font-size: 1.2rem; font-weight: bold; margin-top: 10px;">-</p>
        </div>

        <div id="remark-container" class="form-group" style="display: none;">
            <label for="remark-text" style="color: var(--red);">🔴 Mangel beschreiben:</label>
            <textarea id="remark-text" placeholder="Beschreibung des Fehlerbildes..."></textarea>
            <button class="btn btn-red" onclick="confirmNOK()">Mangel speichern & Weiter</button>
        </div>

        <div class="action-buttons" id="main-actions">
            <button class="btn btn-green" onclick="handleCheck(true)">🟢 OK</button>
            <button class="btn btn-red" onclick="showRemarkInput()">🔴 NICHT OK</button>
        </div>
    </div>

    <!-- 5. ENDKONTROLLE -->
    <div id="screen-final" class="screen">
        <h2>Endkontrolle & Abschluss</h2>
        <div id="final-result-banner" style="text-align: center; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; color: white;"></div>

        <div class="info-card" id="final-summary"></div>

        <div class="result-list" id="final-results-list"></div>

        <div class="form-group" style="margin-top: 15px;">
            <label for="worker-name">👷 Mitarbeiter / Monteur</label>
            <input type="text" id="worker-name" placeholder="Name des Monteurs">
        </div>
        <div class="form-group">
            <label for="inspector-name">👤 Endkontrolle durchgeführt von</label>
            <input type="text" id="inspector-name" placeholder="Name des Prüfers">
        </div>
        <div class="form-group">
            <label for="inspection-date">📅 Datum</label>
            <input type="date" id="inspection-date">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn btn-outline" onclick="printFinalInspection()">🖨️ Drucken / PDF</button>
            <button class="btn btn-outline" onclick="sendMailCurrent()">✉️ Mail senden</button>
        </div>

        <button class="btn btn-green" onclick="saveInspection()" style="margin-top: 10px;">Prüfung Speichern & Archivieren 💾</button>
    </div>

    <!-- 6. ARCHIV -->
    <div id="screen-archive" class="screen">
        <h2>📜 Archivierte Prüfprotokolle</h2>
        
        <div class="form-group">
            <input type="text" id="archive-search" placeholder="🔍 Suche nach Auftrags-Nr, Seriennummer, Modell..." oninput="filterArchive()">
        </div>

        <div id="archive-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
        <button class="btn btn-secondary" onclick="goToScreen('screen-home')" style="margin-top: 10px;">Zurück</button>
    </div>

    <!-- 7. ARCHIV DETAILANSICHT -->
    <div id="screen-archive-detail" class="screen">
        <h2>Prüfprotokoll Detailansicht</h2>
        <div id="archive-detail-banner" style="text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; color: white; margin-bottom: 10px;"></div>
        <div class="info-card" id="archive-detail-info"></div>
        <div class="result-list" id="archive-detail-results"></div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn btn-outline" onclick="printArchiveInspection()">🖨️ Drucken / PDF</button>
            <button class="btn btn-outline" onclick="sendMailArchive()">✉️ Mail senden</button>
        </div>
        <button class="btn btn-secondary" onclick="goToScreen('screen-archive')" style="margin-top: 10px;">Zurück zum Archiv</button>
    </div>
</div>

<script>
    const masterChecklistGrouped = [
        {
            groupName: "Baugruppe 1: Basismontage",
            items: [
                "Zwischenlager montiert",
                "Zwischenlager geprüft",
                "Flanschlager festgezogen",
                "Madenschrauben an Flanschlager festgezogen",
                "Gleitlagerkopf angezogen",
                "Schmierleitung festgezogen",
                "Öl eingesetzt / aufgefüllt"
            ]
        },
        {
            groupName: "Baugruppe 2: Flügel, Ring & Gummis",
            items: [
                "Ring ohne Flügel montiert",
                "Ring mit Flügel montiert",
                "Flügel mit Kiloschlüssel festgezogen",
                "Ring exakt ausgerichtet",
                "Gummis montiert"
            ]
        },
        {
            groupName: "Baugruppe 3: Antrieb & Motorkiste",
            items: [
                "Motorkiste montiert & festgezogen",
                "Motor montiert & festgezogen",
                "Keilriemen auf Spannung & Sitz geprüft",
                "Riemenscheiben festgezogen"
            ]
        },
        {
            groupName: "Baugruppe 4: Elektrik & Testlauf",
            items: [
                "Schaltkasten auf Funktion getestet",
                "Kabel & Anschlüsse geprüft",
                "Maschinen-Testlauf durchgeführt"
            ]
        },
        {
            groupName: "Baugruppe 5: Zubehör, Verpackung & Optik",
            items: [
                "Haube montiert & festgezogen",
                "Spanner verpackt / beigelegt",
                "Deckelsatz-System verpackt",
                "Schrauben für Deckelsatz beigelegt",
                "Typenschild geklebt",
                "Optische Sauberkeit der Maschine geprüft",
                "Alle erforderlichen Aufkleber vorhanden & korrekt angebracht"
            ]
        }
    ];

    let orders = JSON.parse(localStorage.getItem('machine_orders_v2') || '[]');
    let archive = JSON.parse(localStorage.getItem('machine_archive_v2') || '[]');
    let currentOrder = null;
    let activeChecklist = [];
    let currentStep = 0;
    let inspectionResults = [];
    let selectedArchiveItem = null;

    window.onload = function() {
        renderChecklistSelection();
    };

    function renderChecklistSelection() {
        const container = document.getElementById('checklist-selection-container');
        container.innerHTML = '';

        masterChecklistGrouped.forEach(group => {
            const title = document.createElement('div');
            title.className = 'bg-section-title';
            title.innerText = group.groupName;
            container.appendChild(title);

            group.items.forEach(itemText => {
                const label = document.createElement('label');
                label.className = 'checkbox-group';
                label.innerHTML = `
                    <input type="checkbox" class="single-check-item" data-text="${itemText}" checked>
                    <div>${itemText}</div>
                `;
                container.appendChild(label);
            });
        });
    }

    function toggleAllCheckboxes(status) {
        document.querySelectorAll('.single-check-item').forEach(cb => cb.checked = status);
    }

    function goToScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if (screenId === 'screen-orders') renderOrders();
        if (screenId === 'screen-archive') {
            document.getElementById('archive-search').value = '';
            renderArchive();
        }
    }

    function createOrder() {
        const orderNo = document.getElementById('order-no').value.trim();
        const type = document.getElementById('order-type').value.trim();
        const serial = document.getElementById('order-serial').value.trim();

        if (!orderNo || !type || !serial) {
            alert("Bitte Auftragsnummer, Maschinentyp und Seriennummer eingeben.");
            return;
        }

        const selectedItems = [];
        document.querySelectorAll('.single-check-item:checked').forEach(cb => {
            selectedItems.push(cb.getAttribute('data-text'));
        });

        if (selectedItems.length === 0) {
            alert("Bitte mindestens einen Prüfpunkt auswählen.");
            return;
        }

        const newOrder = {
            id: Date.now(),
            orderNo: orderNo,
            type: type,
            serial: serial,
            pipe: document.getElementById('order-pipe').value.trim() || 'Keine Angabe',
            axis: document.getElementById('order-axis').value.trim() || 'Standard-Achse',
            kw: document.getElementById('order-kw').value.trim() || 'Standard / keine Angabe',
            comment: document.getElementById('order-comment').value.trim() || '',
            selectedItems: selectedItems,
            status: 'OFFEN'
        };

        orders.push(newOrder);
        localStorage.setItem('machine_orders_v2', JSON.stringify(orders));
        alert('Prüfauftrag erfolgreich angelegt!');
        
        document.getElementById('order-no').value = '';
        document.getElementById('order-type').value = '';
        document.getElementById('order-serial').value = '';
        document.getElementById('order-pipe').value = '';
        document.getElementById('order-axis').value = '';
        document.getElementById('order-kw').value = '';
        document.getElementById('order-comment').value = '';
        toggleAllCheckboxes(true);

        goToScreen('screen-orders');
    }

    function renderOrders() {
        const container = document.getElementById('orders-list');
        container.innerHTML = '';

        if (orders.length === 0) {
            container.innerHTML = '<p style="text-align:center; color: var(--gray);">Keine offenen Prüfungen vorhanden.</p>';
            return;
        }

        orders.forEach(o => {
            const div = document.createElement('div');
            div.className = 'order-card';
            div.innerHTML = `
                <div style="flex: 1; margin-right: 10px;">
                    <strong>Auftrag-Nr: ${o.orderNo}</strong> | <strong>${o.type}</strong> (SN: ${o.serial})<br>
                    <small>Rohr: ${o.pipe} | Achse: ${o.axis} | Motor: ${o.kw}</small>
                    ${o.comment ? `<br><small style="color: var(--primary); font-style: italic;">💬 ${o.comment}</small>` : ''}
                    <br><small style="color: var(--gray);">${o.selectedItems.length} Einzelprüfpunkte</small>
                </div>
                <button class="btn btn-green" style="width: auto; padding: 8px 12px; white-space: nowrap;" onclick="startInspection(${o.id})">Prüfen ▶</button>
            `;
            container.appendChild(div);
        });
    }

    function startInspection(orderId) {
        currentOrder = orders.find(o => o.id === orderId);
        activeChecklist = [...currentOrder.selectedItems];

        currentStep = 0;
        inspectionResults = [];

        document.getElementById('inspection-info').innerHTML = `
            <b>Auftrags-Nr:</b> ${currentOrder.orderNo}<br>
            <b>Typ:</b> ${currentOrder.type} | <b>SN:</b> ${currentOrder.serial}<br>
            <b>Spezifikation:</b> Rohrlänge: ${currentOrder.pipe} | Achse: ${currentOrder.axis} | Motor: ${currentOrder.kw}
            ${currentOrder.comment ? `<br><b style="color: var(--primary);">💬 Werkstatt-Hinweis:</b> ${currentOrder.comment}` : ''}
        `;

        updateStepView();
        goToScreen('screen-inspection');
    }

    function updateStepView() {
        const total = activeChecklist.length;
        document.getElementById('progress-text').innerText = `${currentStep} / ${total}`;
        document.getElementById('progress-bar').style.width = `${(currentStep / total) * 100}%`;

        if (currentStep < total) {
            document.getElementById('check-step').innerText = `Prüfpunkt ${currentStep + 1} von ${total}`;
            document.getElementById('check-text').innerText = activeChecklist[currentStep];
            document.getElementById('remark-container').style.display = 'none';
            document.getElementById('main-actions').style.display = 'flex';
            document.getElementById('remark-text').value = '';
        } else {
            finishInspection();
        }
    }

    function handleCheck(isOk) {
        if (isOk) {
            inspectionResults.push({ item: activeChecklist[currentStep], status: 'OK', remark: '' });
            currentStep++;
            updateStepView();
        }
    }

    function showRemarkInput() {
        document.getElementById('main-actions').style.display = 'none';
        document.getElementById('remark-container').style.display = 'flex';
    }

    function confirmNOK() {
        const remark = document.getElementById('remark-text').value.trim();
        if (!remark) { alert("Bitte Mangel beschreiben."); return; }
        inspectionResults.push({ item: activeChecklist[currentStep], status: 'NOK', remark: remark });
        currentStep++;
        updateStepView();
    }

    function finishInspection() {
        renderFinalScreen();
        document.getElementById('inspection-date').value = new Date().toISOString().split('T')[0];
        goToScreen('screen-final');
    }

    function renderFinalScreen() {
        const totalCount = inspectionResults.length;
        const okCount = inspectionResults.filter(r => r.status === 'OK' || r.status === 'KORRIGIERT').length;
        const nokCount = totalCount - okCount;
        const successRate = totalCount > 0 ? Math.round((okCount / totalCount) * 100) : 0;

        currentOrder.totalCount = totalCount;
        currentOrder.okCount = okCount;
        currentOrder.nokCount = nokCount;
        currentOrder.successRate = successRate;

        const hasErrors = nokCount > 0;
        const banner = document.getElementById('final-result-banner');

        currentOrder.status = hasErrors ? "NICHT FREIGEGEBEN" : "FREIGEGEBEN";

        if (hasErrors) {
            banner.innerText = `🔴 MASCHINE NICHT FREIGEGEBEN (${successRate}% OK)`;
            banner.style.backgroundColor = "var(--red)";
        } else {
            banner.innerText = `🟢 MASCHINE FREIGEGEBEN (100% OK)`;
            banner.style.backgroundColor = "var(--green)";
        }

        let barColor = successRate === 100 ? 'var(--green)' : (successRate >= 80 ? 'var(--yellow)' : 'var(--red)');

        document.getElementById('final-summary').innerHTML = `
            <b>Auftrags-Nr:</b> ${currentOrder.orderNo}<br>
            <b>Typ:</b> ${currentOrder.type} | <b>SN:</b> ${currentOrder.serial}<br>
            <b>Rohrlänge:</b> ${currentOrder.pipe} | <b>Achse:</b> ${currentOrder.axis}<br>
            <b>Motor:</b> ${currentOrder.kw}<br>
            ${currentOrder.comment ? `<b>Hinweis:</b> ${currentOrder.comment}<br>` : ''}
            <hr style="margin: 8px 0; border: 0.5px solid var(--border-color);">
            <b>Erfolgsquote:</b> ${successRate}% OK (${okCount} von ${totalCount} Prüfpunkte OK, ${nokCount} Mängel)
            <div class="progress-bar-container" style="height: 8px; margin-top: 6px;">
                <div class="progress-bar" style="width: ${successRate}%; background-color: ${barColor};"></div>
            </div>
        `;

        const resultsList = document.getElementById('final-results-list');
        resultsList.innerHTML = '<h4>Prüfpunkte & Mängelbehebung:</h4>';
        
        inspectionResults.forEach((r, idx) => {
            const itemDiv = document.createElement('div');
            let statusClass = r.status === 'OK' ? 'ok' : (r.status === 'KORRIGIERT' ? 'fixed' : 'nok');
            itemDiv.className = `result-item ${statusClass}`;
            
            let statusText = r.status;
            if (r.status === 'KORRIGIERT') statusText = '🟢 KORRIGIERT (OK)';

            itemDiv.innerHTML = `
                <div><strong>${idx + 1}. ${r.item}</strong> - <span>${statusText}</span></div>
                ${r.remark ? `<small style="color: var(--red); margin-top: 3px;">⚠️ Mangel: ${r.remark}</small>` : ''}
                ${r.fixNote ? `<small style="color: var(--green); margin-top: 3px;">✅ Nachbesserung: ${r.fixNote}</small>` : ''}
                ${r.status === 'NOK' ? `<button class="btn-fix" onclick="fixItemCurrent(${idx})">🛠️ Mangel beheben & freigeben</button>` : ''}
            `;
            resultsList.appendChild(itemDiv);
        });
    }

    function fixItemCurrent(index) {
        const fixNote = prompt("Bitte beschreiben, wie der Mangel behoben wurde (z.B. 'Schraube nachgezogen'):");
        if (!fixNote) return;

        inspectionResults[index].status = 'KORRIGIERT';
        inspectionResults[index].fixNote = fixNote;
        renderFinalScreen();
    }

    function fixItemArchive(index) {
        if (!selectedArchiveItem) return;
        const fixNote = prompt("Bitte beschreiben, wie der Mangel behoben wurde (z.B. 'Teil ausgetauscht'):");
        if (!fixNote) return;

        selectedArchiveItem.results[index].status = 'KORRIGIERT';
        selectedArchiveItem.results[index].fixNote = fixNote;

        const totalCount = selectedArchiveItem.results.length;
        const okCount = selectedArchiveItem.results.filter(r => r.status === 'OK' || r.status === 'KORRIGIERT').length;
        const nokCount = totalCount - okCount;
        const successRate = totalCount > 0 ? Math.round((okCount / totalCount) * 100) : 0;

        selectedArchiveItem.okCount = okCount;
        selectedArchiveItem.nokCount = nokCount;
        selectedArchiveItem.successRate = successRate;
        selectedArchiveItem.status = nokCount === 0 ? "FREIGEGEBEN" : "NICHT FREIGEGEBEN";

        localStorage.setItem('machine_archive_v2', JSON.stringify(archive));
        viewArchiveDetail(selectedArchiveItem.id);
    }

    function saveInspection() {
        const worker = document.getElementById('worker-name').value.trim();
        const inspector = document.getElementById('inspector-name').value.trim();
        const date = document.getElementById('inspection-date').value;

        if (!worker || !inspector) { alert("Bitte Monteur und Prüfer eintragen."); return; }

        const archivedItem = {
            ...currentOrder,
            worker,
            inspector,
            date,
            results: inspectionResults,
            completedAt: new Date().toLocaleString('de-DE')
        };

        archive.unshift(archivedItem);
        localStorage.setItem('machine_archive_v2', JSON.stringify(archive));

        orders = orders.filter(o => o.id !== currentOrder.id);
        localStorage.setItem('machine_orders_v2', JSON.stringify(orders));

        alert("Prüfung gespeichert und archiviert!");
        goToScreen('screen-home');
    }

    function renderArchive(filteredData = null) {
        const container = document.getElementById('archive-list');
        container.innerHTML = '';

        const dataToRender = filteredData || archive;

        if (dataToRender.length === 0) {
            container.innerHTML = '<p style="text-align:center; color: var(--gray);">Keine passenden Protokolle gefunden.</p>';
            return;
        }

        dataToRender.forEach(item => {
            const div = document.createElement('div');
            div.className = 'order-card';
            
            const isOk = item.status === 'FREIGEGEBEN';
            const rate = item.successRate !== undefined ? item.successRate : (isOk ? 100 : 0);
            
            let badgeClass = 'badge-green';
            if (rate < 100 && rate >= 80) badgeClass = 'badge-yellow';
            if (rate < 80) badgeClass = 'badge-red';

            div.innerHTML = `
                <div style="flex: 1; margin-right: 10px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <strong>Auftrag-Nr: ${item.orderNo} - ${item.type}</strong>
                        <span class="badge-status ${badgeClass}">${rate}% OK</span>
                    </div>
                    <small style="color: var(--gray);">SN: ${item.serial} | Datum: ${item.date} | Monteur: ${item.worker}</small>
                    <div class="progress-bar-container" style="height: 5px; margin: 6px 0 0 0;">
                        <div class="progress-bar" style="width: ${rate}%; background-color: ${rate === 100 ? 'var(--green)' : (rate >= 80 ? 'var(--yellow)' : 'var(--red)')};"></div>
                    </div>
                </div>
                <button class="btn btn-outline" style="width: auto; padding: 8px 12px; white-space: nowrap;" onclick="viewArchiveDetail(${item.id})">Details 👁️</button>
            `;
            container.appendChild(div);
        });
    }

    function filterArchive() {
        const query = document.getElementById('archive-search').value.toLowerCase().trim();
        if (!query) {
            renderArchive(archive);
            return;
        }

        const filtered = archive.filter(item => {
            return (item.orderNo && item.orderNo.toLowerCase().includes(query)) ||
                   (item.serial && item.serial.toLowerCase().includes(query)) ||
                   (item.type && item.type.toLowerCase().includes(query)) ||
                   (item.worker && item.worker.toLowerCase().includes(query)) ||
                   (item.inspector && item.inspector.toLowerCase().includes(query)) ||
                   (item.date && item.date.includes(query));
        });

        renderArchive(filtered);
    }

    function viewArchiveDetail(id) {
        selectedArchiveItem = archive.find(a => a.id === id);
        if (!selectedArchiveItem) return;

        const isOk = selectedArchiveItem.status === 'FREIGEGEBEN';
        const rate = selectedArchiveItem.successRate !== undefined ? selectedArchiveItem.successRate : (isOk ? 100 : 0);
        const banner = document.getElementById('archive-detail-banner');
        
        banner.innerText = isOk ? `🟢 MASCHINE FREIGEGEBEN (${rate}% OK)` : `🔴 MASCHINE NICHT FREIGEGEBEN (${rate}% OK)`;
        banner.style.backgroundColor = isOk ? "var(--green)" : "var(--red)";

        let barColor = rate === 100 ? 'var(--green)' : (rate >= 80 ? 'var(--yellow)' : 'var(--red)');

        document.getElementById('archive-detail-info').innerHTML = `
            <b>Auftrags-Nr:</b> ${selectedArchiveItem.orderNo}<br>
            <b>Typ:</b> ${selectedArchiveItem.type} | <b>SN:</b> ${selectedArchiveItem.serial}<br>
            <b>Spezifikation:</b> Rohrlänge ${selectedArchiveItem.pipe} | Achse: ${selectedArchiveItem.axis} | Motor: ${selectedArchiveItem.kw}<br>
            ${selectedArchiveItem.comment ? `<b>Hinweis:</b> ${selectedArchiveItem.comment}<br>` : ''}
            <hr style="margin: 8px 0; border: 0.5px solid var(--border-color);">
            <b>Monteur:</b> ${selectedArchiveItem.worker} | <b>Prüfer:</b> ${selectedArchiveItem.inspector}<br>
            <b>Datum:</b> ${selectedArchiveItem.date}<br>
            <b>Erfolgsquote:</b> ${rate}% OK (${selectedArchiveItem.okCount || '-'} von ${selectedArchiveItem.totalCount || '-'} OK)
            <div class="progress-bar-container" style="height: 6px; margin-top: 6px;">
                <div class="progress-bar" style="width: ${rate}%; background-color: ${barColor};"></div>
            </div>
        `;

        const resultsContainer = document.getElementById('archive-detail-results');
        resultsContainer.innerHTML = '<h4>Prüfpunkte:</h4>';

        selectedArchiveItem.results.forEach((r, idx) => {
            const itemDiv = document.createElement('div');
            let statusClass = r.status === 'OK' ? 'ok' : (r.status === 'KORRIGIERT' ? 'fixed' : 'nok');
            itemDiv.className = `result-item ${statusClass}`;

            let statusText = r.status;
            if (r.status === 'KORRIGIERT') statusText = '🟢 KORRIGIERT (OK)';

            itemDiv.innerHTML = `
                <div><strong>${idx + 1}. ${r.item}</strong> - <span>${statusText}</span></div>
                ${r.remark ? `<small style="color: var(--red); margin-top: 3px;">⚠️ Mangel: ${r.remark}</small>` : ''}
                ${r.fixNote ? `<small style="color: var(--green); margin-top: 3px;">✅ Nachbesserung: ${r.fixNote}</small>` : ''}
                ${r.status === 'NOK' ? `<button class="btn-fix" onclick="fixItemArchive(${idx})">🛠️ Mangel beheben & freigeben</button>` : ''}
            `;
            resultsContainer.appendChild(itemDiv);
        });

        goToScreen('screen-archive-detail');
    }

    function printFinalInspection() {
        appendPrintDetails('final-summary', 'worker-name', 'inspector-name', 'inspection-date');
        window.print();
    }

    function printArchiveInspection() {
        window.print();
    }

    function appendPrintDetails(summaryId, workerId, inspectorId, dateId) {
        const worker = document.getElementById(workerId).value.trim() || 'Nicht angegeben';
        const inspector = document.getElementById(inspectorId).value.trim() || 'Nicht angegeben';
        const date = document.getElementById(dateId).value || 'Nicht angegeben';

        let printDetails = document.getElementById('print-summary-extension');
        if (!printDetails) {
            printDetails = document.createElement('div');
            printDetails.id = 'print-summary-extension';
            document.getElementById(summaryId).appendChild(printDetails);
        }

        printDetails.innerHTML = `
            <hr style="margin: 8px 0; border: 0.5px solid var(--border-color);">
            <b>👷 Monteur:</b> ${worker}<br>
            <b>👤 Endkontrolle:</b> ${inspector}<br>
            <b>📅 Datum:</b> ${date}
        `;
    }

    function sendMailCurrent() {
        const worker = document.getElementById('worker-name').value.trim() || 'Unbekannt';
        const inspector = document.getElementById('inspector-name').value.trim() || 'Unbekannt';
        const date = document.getElementById('inspection-date').value;

        generateAndSendMail(currentOrder, inspectionResults, worker, inspector, date);
    }

    function sendMailArchive() {
        if (!selectedArchiveItem) return;
        generateAndSendMail(
            selectedArchiveItem, 
            selectedArchiveItem.results, 
            selectedArchiveItem.worker, 
            selectedArchiveItem.inspector, 
            selectedArchiveItem.date
        );
    }

    function generateAndSendMail(order, results, worker, inspector, date) {
        const rate = order.successRate !== undefined ? order.successRate : (order.status === 'FREIGEGEBEN' ? 100 : 0);
        const subject = encodeURIComponent(`Prüfprotokoll Auftr-Nr: ${order.orderNo} (${rate}% OK): ${order.type} - SN: ${order.serial}`);
        
        let body = `PRÜFPROTOKOLL MASCHINENPRÜFUNG\n-----------------------------------\n`;
        body += `Auftrags-Nr: ${order.orderNo}\n`;
        body += `Typ: ${order.type}\nSeriennummer: ${order.serial}\n`;
        body += `Rohrlänge: ${order.pipe}\nAchse: ${order.axis}\nMotor: ${order.kw}\n`;
        if (order.comment) body += `Werkstatt-Hinweis: ${order.comment}\n`;
        body += `Monteur: ${worker}\nPrüfer: ${inspector}\nDatum: ${date}\n`;
        body += `Ergebnis: ${order.status} (${rate}% OK)\n\nPRÜFERGEBNISSE:\n`;

        results.forEach((r, i) => {
            let line = `${i+1}. ${r.item}: ${r.status}`;
            if (r.remark) line += ` (Mangel: ${r.remark})`;
            if (r.fixNote) line += ` [Nachbesserung: ${r.fixNote}]`;
            body += line + `\n`;
        });

        window.location.href = `mailto:?subject=${subject}&body=${encodeURIComponent(body)}`;
    }
</script>
</body>
</html>
