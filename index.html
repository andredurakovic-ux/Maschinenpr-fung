
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maschinen-Prüfung</title>
    <style>
        :root {
            --primary: #007aff;
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --text: #000000;
            --border-color: #e5e5ea;
            --gray: #8e8e93;
            --green: #34c759;
            --red: #ff3b30;
            --yellow: #ffcc00;
        }

        body.dark-mode {
            --primary: #0a84ff;
            --bg: #1c1c1e;
            --card-bg: #2c2c2e;
            --text: #ffffff;
            --border-color: #38383a;
            --gray: #98989d;
            --green: #30d158;
            --red: #ff453a;
            --yellow: #ffd60a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 30px; transition: background-color 0.3s, color 0.3s; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .header h1 { font-size: 1.2rem; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-theme, .btn-lang { background: none; border: 1px solid var(--border-color); color: var(--text); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }

        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .screen { display: none; }
        .screen.active { display: block; }

        .card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--gray); margin-bottom: 4px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--bg); color: var(--text); font-size: 0.95rem; }

        .btn { display: inline-block; width: 100%; padding: 12px; border-radius: 8px; border: none; background-color: var(--primary); color: white; font-weight: 600; font-size: 1rem; cursor: pointer; text-align: center; margin-top: 5px; }
        .btn-green { background-color: var(--green); }
        .btn-red { background-color: var(--red); }
        .btn-outline { background: none; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline-red { background: none; border: 1px solid var(--red); color: var(--red); }
        
        .order-card { background-color: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .badge-status { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; color: white; }
        .badge-green { background-color: var(--green); }
        .badge-yellow { background-color: var(--yellow); color: black; }
        .badge-red { background-color: var(--red); }

        .progress-bar-container { width: 100%; background-color: var(--border-color); height: 10px; border-radius: 5px; overflow: hidden; margin: 10px 0; }
        .progress-bar { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.3s; }

        .result-item { padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid var(--gray); background-color: var(--bg); }
        .result-item.ok { border-left-color: var(--green); }
        .result-item.nok { border-left-color: var(--red); }
        .result-item.fixed { border-left-color: var(--yellow); }

        .btn-fix { margin-top: 5px; padding: 4px 8px; font-size: 0.8rem; background-color: var(--yellow); border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        @media print {
            body { background: white; color: black; }
            .header, .btn, .btn-theme, .btn-lang, .no-print { display: none !important; }
            .card { border: none; box-shadow: none; padding: 0; }
            .screen { display: block !important; }
            #screen-final, #screen-archive-detail { display: block !important; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚙️ Maschinen-Prüfung</h1>
        <div class="header-actions">
            <button class="btn-lang" onclick="toggleLanguage()" id="lang-btn">🌐 FR</button>
            <button class="btn-theme" onclick="toggleTheme()">🌙</button>
        </div>
    </div>

    <div class="container">
        
        <!-- Screen: Home / Übersicht -->
        <div id="screen-home" class="screen active">
            <div class="card">
                <h3>Willkommen</h3>
                <p style="color: var(--gray); margin-top: 5px; font-size: 0.9rem;">Bitte wählen Sie eine Option:</p>
                <button class="btn" onclick="goToScreen('screen-create-order')" style="margin-top: 15px;">➕ Neuen Auftrag anlegen</button>
                <button class="btn btn-outline" onclick="goToScreen('screen-orders')" style="margin-top: 10px;">📋 Offene Aufträge</button>
                <button class="btn btn-outline" onclick="goToScreen('screen-archive')" style="margin-top: 10px;">📂 Archiv / Protokolle</button>
            </div>
        </div>

        <!-- Screen: Auftrag anlegen -->
        <div id="screen-create-order" class="screen">
            <div class="card">
                <h3>Neuen Auftrag anlegen</h3>
                <br>
                <div class="form-group">
                    <label>Auftrags-Nummer</label>
                    <input type="text" id="inp-order-no" placeholder="z.B. 104522">
                </div>
                <div class="form-group">
                    <label>Maschinen-Typ</label>
                    <select id="inp-type" onchange="handleTypeChange()">
                        <option value="">-- Bitte wählen --</option>
                        <option value="TSR">TSR</option>
                        <option value="TS">TS</option>
                        <option value="LFE">LFE</option>
                        <option value="LFS">LFS</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Seriennummer</label>
                    <input type="text" id="inp-serial" placeholder="z.B. SN-9982">
                </div>
                <div class="form-group">
                    <label>Rohrlänge</label>
                    <input type="text" id="inp-pipe" placeholder="z.B. 1500 mm">
                </div>
                <div class="form-group">
                    <label>Achse</label>
                    <input type="text" id="inp-axis" placeholder="z.B. Standard">
                </div>
                <div class="form-group">
                    <label>Motor (kW)</label>
                    <input type="text" id="inp-kw" placeholder="z.B. 7.5 kW">
                </div>
                <div class="form-group">
                    <label>Kommentar / Werkstatt-Hinweis</label>
                    <textarea id="inp-comment" rows="2" placeholder="Sonderwünsche..."></textarea>
                </div>

                <h4>Prüfpunkte auswählen:</h4>
                <div id="checklist-selection" style="margin-top: 10px; max-height: 200px; overflow-y: auto; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px;">
                    <!-- Dynamische Checkboxen -->
                </div>

                <button class="btn btn-green" onclick="saveNewOrder()" style="margin-top: 15px;">💾 Auftrag speichern</button>
                <button class="btn btn-outline" onclick="goToScreen('screen-home')" style="margin-top: 8px;">Abbrechen</button>
            </div>
        </div>

        <!-- Screen: Offene Aufträge -->
        <div id="screen-orders" class="screen">
            <div class="card">
                <h3>Offene Prüfaufträge</h3>
                <br>
                <div id="orders-list">
                    <!-- Auftragsliste -->
                </div>
                <button class="btn btn-outline" onclick="goToScreen('screen-home')" style="margin-top: 10px;">Zurück</button>
            </div>
        </div>
        <!-- Screen: Prüfung durchführen -->
        <div id="screen-inspection" class="screen">
            <div class="card">
                <div id="inspection-info" style="font-size: 0.85rem; color: var(--gray); margin-bottom: 10px;"></div>
                
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="check-step" style="font-weight: bold; font-size: 0.9rem;">Prüfpunkt 1 von X</span>
                    <span id="progress-text" style="font-size: 0.85rem; color: var(--gray);">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>

                <div style="margin: 20px 0; min-height: 60px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: bold; font-size: 1.1rem; background-color: var(--bg); padding: 15px; border-radius: 8px;" id="check-text">
                    -- Prüfpunkt --
                </div>

                <div class="form-group">
                    <label>Live-Notiz / Kommentar zum Punkt (optional)</label>
                    <input type="text" id="step-note-text" placeholder="z.B. Etwas schwergängig..." oninput="saveCurrentNoteLive()">
                </div>

                <div id="main-actions" style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn btn-green" onclick="handleCheck(true)">✅ OK</button>
                    <button class="btn btn-red" onclick="showRemarkInput()">⚠️ Mangel (NOK)</button>
                </div>

                <div id="remark-container" style="display: none; margin-top: 15px;">
                    <div class="form-group">
                        <label style="color: var(--red);">Mangel beschreiben:</label>
                        <textarea id="remark-text" rows="2" placeholder="Beschreiben Sie den Mangel genauer..."></textarea>
                    </div>
                    <button class="btn btn-red" onclick="confirmNOK()">Mangel bestätigen & Weiter</button>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button id="btn-prev-step" class="btn btn-outline" style="flex: 1;" onclick="prevStep()">⬅️ Zurück</button>
                    <button class="btn btn-outline" style="flex: 1;" onclick="pauseInspection()">⏸️ Pausieren</button>
                </div>
            </div>
        </div>

        <!-- Screen: Prüfung abgeschlossen / Freigabe -->
        <div id="screen-final" class="screen">
            <div class="card">
                <div id="final-result-banner" style="padding: 10px; text-align: center; border-radius: 8px; color: white; font-weight: bold; margin-bottom: 15px;">
                    STATUS
                </div>

                <div id="final-summary" style="font-size: 0.9rem; margin-bottom: 15px;"></div>

                <div class="form-group">
                    <label>Monteur Name</label>
                    <input type="text" id="worker-name" placeholder="z.B. Max Mustermann">
                </div>
                <div class="form-group">
                    <label>Prüfer Name</label>
                    <input type="text" id="inspector-name" placeholder="z.B. Hans Weber">
                </div>
                <div class="form-group">
                    <label>Prüfdatum</label>
                    <input type="date" id="inspection-date">
                </div>

                <div id="final-results-list" style="margin-top: 15px;"></div>

                <button class="btn btn-green" onclick="saveInspection()" style="margin-top: 15px;">💾 Protokoll im Archiv speichern</button>
                <button class="btn btn-outline" onclick="sendMailCurrent()" style="margin-top: 8px;">✉️ Per Mail senden</button>
                <button class="btn btn-outline" onclick="printFinalInspection()" style="margin-top: 8px;">🖨️ Drucken / PDF</button>
            </div>
        </div>

        <!-- Screen: Archiv -->
        <div id="screen-archive" class="screen">
            <div class="card">
                <h3>Archiv & Protokolle</h3>
                <br>
                <div class="form-group">
                    <input type="text" id="archive-search" placeholder="🔍 Suchen nach Auftrags-Nr, SN, Monteur..." oninput="filterArchive()">
                </div>
                <div id="archive-list"></div>
                <button class="btn btn-outline" onclick="goToScreen('screen-home')" style="margin-top: 10px;">Zurück</button>
            </div>
        </div>

        <!-- Screen: Archiv Details -->
        <div id="screen-archive-detail" class="screen">
            <div class="card">
                <div id="archive-detail-banner" style="padding: 10px; text-align: center; border-radius: 8px; color: white; font-weight: bold; margin-bottom: 15px;"></div>
                <div id="archive-detail-info" style="font-size: 0.9rem; margin-bottom: 15px;"></div>
                <div id="archive-detail-results"></div>

                <button class="btn btn-outline" onclick="printArchiveInspection()" style="margin-top: 15px;">🖨️ Drucken / PDF</button>
                <button class="btn btn-outline" onclick="sendMailArchive()" style="margin-top: 8px;">✉️ Per Mail senden</button>
                <button class="btn btn-outline-red" onclick="deleteArchiveDetail()" style="margin-top: 8px;">🗑️ Protokoll dauerhaft löschen</button>
                <button class="btn btn-outline" onclick="goToScreen('screen-archive')" style="margin-top: 8px;">Zurück zum Archiv</button>
            </div>
        </div>

    </div>

<script>
    let currentLang = 'de';
    let currentOrderId = null;
    let currentOrder = null;
    let activeChecklist = [];
    let currentStep = 0;
    let inspectionResults = [];
    let selectedArchiveItem = null;

    window.orders = JSON.parse(localStorage.getItem('app_orders')) || [];
    window.archive = JSON.parse(localStorage.getItem('app_archive')) || [];

    const defaultChecklists = {
        "TSR": [
            "Zwischenlager montiert", "Zwischenlager geprüft", "Flanschlager festgezogen",
            "Madenschrauben an Flanschlager festgezogen", "Gleitlagerkopf angezogen",
            "Schmierleitung festgezogen", "Öl eingesetzt / aufgefüllt", "Ring montiert",
            "Flügel montiert", "Flügel mit Kiloschlüssel festgezogen", "Ring exakt ausgerichtet",
            "Gummis montiert", "Motorkiste montiert & festgezogen", "Motor montiert & festgezogen",
            "Keilriemen auf Spannung & Sitz geprüft", "Riemenscheiben festgezogen",
            "Schaltkasten auf Funktion getestet", "Kabel & Anschlüsse geprüft",
            "Maschinen-Testlauf durchgeführt", "Hauben montiert & festgezogen",
            "Spanner verpackt / beigelegt", "Deckelsatz-System verpackt",
            "Schrauben für Deckelsatz beigelegt", "Typenschild geklebt",
            "Optische Sauberkeit der Maschine geprüft",
            "Alle erforderlichen Aufkleber vorhanden & korrekt angebracht",
            "Maschine komplett eingepackt inkl. Flügel"
        ]
    };
    function saveOrdersToFirebase() {
        localStorage.setItem('app_orders', JSON.stringify(window.orders));
    }

    function saveArchiveToFirebase() {
        localStorage.setItem('app_archive', JSON.stringify(window.archive));
    }

    function updateSingleOrderInFirebase(order) {
        saveOrdersToFirebase();
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
    }

    function toggleLanguage() {
        currentLang = currentLang === 'de' ? 'fr' : 'de';
        document.getElementById('lang-btn').innerText = currentLang === 'de' ? '🌐 FR' : '🌐 DE';
        updateStepView();
    }

    function goToScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');

        if (screenId === 'screen-orders') renderOrders();
        if (screenId === 'screen-archive') renderArchive();
    }

    function handleTypeChange() {
        const type = document.getElementById('inp-type').value;
        const container = document.getElementById('checklist-selection');
        container.innerHTML = '';

        const list = defaultChecklists[type] || defaultChecklists["TSR"];
        list.forEach((item, index) => {
            const div = document.createElement('div');
            div.style.marginBottom = '5px';
            div.innerHTML = `<label style="font-weight: normal; font-size: 0.85rem;"><input type="checkbox" value="${item}" checked> ${item}</label>`;
            container.appendChild(div);
        });
    }

    function saveNewOrder() {
        const orderNo = document.getElementById('inp-order-no').value.trim();
        const type = document.getElementById('inp-type').value;
        const serial = document.getElementById('inp-serial').value.trim();
        const pipe = document.getElementById('inp-pipe').value.trim();
        const axis = document.getElementById('inp-axis').value.trim();
        const kw = document.getElementById('inp-kw').value.trim();
        const comment = document.getElementById('inp-comment').value.trim();

        if (!orderNo || !type) {
            alert("Bitte Auftragsnummer und Typ angeben.");
            return;
        }

        const selectedItems = [];
        document.querySelectorAll('#checklist-selection input[type="checkbox"]:checked').forEach(cb => {
            selectedItems.push(cb.value);
        });

        const newOrder = {
            id: Date.now(),
            orderNo, type, serial, pipe, axis, kw, comment,
            selectedItems,
            currentStep: 0,
            inspectionResults: [],
            status: 'Offen'
        };

        window.orders.push(newOrder);
        saveOrdersToFirebase();
        alert("Auftrag angelegt!");
        goToScreen('screen-orders');
    }

    function renderOrders() {
        const container = document.getElementById('orders-list');
        container.innerHTML = '';

        if (window.orders.length === 0) {
            container.innerHTML = '<p style="text-align:center; color: var(--gray);">Keine offenen Aufträge.</p>';
            return;
        }

        window.orders.forEach(order => {
            const div = document.createElement('div');
            div.className = 'order-card';
            div.innerHTML = `
                <div>
                    <strong>Auftrag-Nr: ${order.orderNo} - ${order.type}</strong><br>
                    <small style="color: var(--gray);">SN: ${order.serial} | Fortschritt: ${order.currentStep} / ${order.selectedItems.length}</small>
                </div>
                <div style="display: flex; gap: 5px;">
                    <button class="btn btn-green" style="padding: 6px 10px; font-size: 0.85rem;" onclick="startInspection(${order.id})">▶️ Start</button>
                    <button class="btn btn-outline-red" style="padding: 6px 10px; font-size: 0.85rem;" onclick="deleteOrder(${order.id})">🗑️</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function deleteOrder(orderId) {
        if (confirm("Möchtest du diesen fehlerhaften Auftrag wirklich löschen?")) {
            window.orders = window.orders.filter(o => o.id !== orderId);
            saveOrdersToFirebase();
            renderOrders();
        }
    }

    function startInspection(orderId) {
        currentOrder = window.orders.find(o => o.id === orderId);
        activeChecklist = [...currentOrder.selectedItems];
        currentStep = currentOrder.currentStep || 0;
        inspectionResults = currentOrder.inspectionResults || [];

        document.getElementById('inspection-info').innerHTML = `
            <b>Auftrags-Nr:</b> ${currentOrder.orderNo} | <b>Typ:</b> ${currentOrder.type} | <b>SN:</b> ${currentOrder.serial}<br>
            <b>Spezifikation:</b> Rohrlänge: ${currentOrder.pipe} | Achse: ${currentOrder.axis} | Motor: ${currentOrder.kw}
            ${currentOrder.comment ? `<br><b>Hinweis:</b> ${currentOrder.comment}` : ''}
        `;

        updateStepView();
        goToScreen('screen-inspection');
    }

    function updateStepView() {
        const total = activeChecklist.length;

        if (currentStep > total) {
            currentStep = total;
        }

        const percent = total > 0 ? Math.round((currentStep / total) * 100) : 0;
        document.getElementById('progress-text').innerText = `${currentStep} / ${total}`;
        document.getElementById('progress-bar').style.width = `${percent}%`;

        const prevBtn = document.getElementById('btn-prev-step');
        if (prevBtn) {
            prevBtn.style.opacity = currentStep > 0 ? "1" : "0.4";
            prevBtn.style.pointerEvents = currentStep > 0 ? "auto" : "none";
        }

        if (currentOrder) {
            currentOrder.currentStep = currentStep;
            currentOrder.inspectionResults = inspectionResults;
            updateSingleOrderInFirebase(currentOrder);
        }

        if (currentStep < total) {
            document.getElementById('check-step').innerText = `Prüfpunkt ${currentStep + 1} von ${total}`;
            
            // Korrigierte Zeile mit der fehlenden Klammer:
            document.getElementById('check-text').innerText = translateCheckItem(activeChecklist[currentStep]); 
            
            document.getElementById('remark-container').style.display = 'none';
            document.getElementById('main-actions').style.display = 'flex';
            document.getElementById('remark-text').value = '';

            const existingResult = inspectionResults[currentStep];
            document.getElementById('step-note-text').value = (existingResult && existingResult.note) ? existingResult.note : (currentOrder.liveNote || '');
        } else {
            finishInspection();
        }
    }

    function saveCurrentNoteLive() {
        if (!currentOrder) return;
        const note = document.getElementById('step-note-text').value;
        currentOrder.liveNote = note;
        updateSingleOrderInFirebase(currentOrder);
    }

    function handleCheck(isOk) {
        const total = activeChecklist.length;
        if (currentStep >= total) return;

        const note = document.getElementById('step-note-text').value.trim();

        if (isOk) {
            inspectionResults[currentStep] = { 
                item: activeChecklist[currentStep], 
                status: 'OK', 
                remark: '',
                note: note
            };
            currentStep++;
            currentOrder.liveNote = ''; 
            updateStepView();
        }
    }

    function showRemarkInput() {
        document.getElementById('main-actions').style.display = 'none';
        document.getElementById('remark-container').style.display = 'flex';
    }

    function confirmNOK() {
        const total = activeChecklist.length;
        if (currentStep >= total) return;

        const remark = document.getElementById('remark-text').value.trim();
        const note = document.getElementById('step-note-text').value.trim();

        if (!remark) { 
            alert("Bitte Mangel beschreiben."); 
            return; 
        }

        inspectionResults[currentStep] = { 
            item: activeChecklist[currentStep], 
            status: 'NOK', 
            remark: remark,
            note: note
        };
        currentStep++;
        currentOrder.liveNote = ''; 
        updateStepView();
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            updateStepView();
        }
    }

    function pauseInspection() {
        if (currentOrder) {
            currentOrder.currentStep = currentStep;
            currentOrder.inspectionResults = inspectionResults;
            updateSingleOrderInFirebase(currentOrder);
        }
        goToScreen('screen-orders');
    }

    function finishInspection() {
        renderFinalScreen();
        document.getElementById('inspection-date').value = new Date().toISOString().split('T')[0];
        goToScreen('screen-final');
    }

    function renderFinalScreen() {
        const validResults = inspectionResults.filter(r => r !== undefined && r !== null);
        const totalCount = validResults.length;
        const okCount = validResults.filter(r => r.status === 'OK' || r.status === 'KORRIGIERT').length;
        const nokCount = totalCount - okCount;
        const successRate = totalCount > 0 ? Math.round((okCount / totalCount) * 100) : 0;

        currentOrder.totalCount = totalCount;
        currentOrder.okCount = okCount;
        currentOrder.nokCount = nokCount;
        currentOrder.successRate = successRate;

        const hasErrors = nokCount > 0;
        const banner = document.getElementById('final-result-banner');

        currentOrder.status = hasErrors ? "NICHT FREIGEGEBEN" : "FREIGEGEBEN";

        if (hasErrors) {
            banner.innerText = `🔴 MASCHINE NICHT FREIGEGEBEN (${successRate}% OK)`;
            banner.style.backgroundColor = "var(--red)";
        } else {
            banner.innerText = `🟢 MASCHINE FREIGEGEBEN (100% OK)`;
            banner.style.backgroundColor = "var(--green)";
        }

        let barColor = successRate === 100 ? 'var(--green)' : (successRate >= 80 ? 'var(--yellow)' : 'var(--red)');

        document.getElementById('final-summary').innerHTML = `
            <b>Auftrags-Nr:</b> ${currentOrder.orderNo}<br>
            <b>Typ:</b> ${currentOrder.type} | <b>SN:</b> ${currentOrder.serial}<br>
            <b>Rohrlänge:</b> ${currentOrder.pipe} | <b>Achse:</b> ${currentOrder.axis}<br>
            <b>Motor:</b> ${currentOrder.kw}<br>
            ${currentOrder.comment ? `<b>Hinweis:</b> ${currentOrder.comment}<br>` : ''}
            <hr style="margin: 8px 0; border: 0.5px solid var(--border-color);">
            <b>Erfolgsquote:</b> ${successRate}% OK (${okCount} von ${totalCount} Prüfpunkte OK, ${nokCount} Mängel)
            <div class="progress-bar-container" style="height: 8px; margin-top: 6px;">
                <div class="progress-bar" style="width: ${successRate}%; background-color: ${barColor};"></div>
            </div>
        `;

        const resultsList = document.getElementById('final-results-list');
        resultsList.innerHTML = '<h4>Prüfpunkte & Mängelbehebung:</h4>';
        
        validResults.forEach((r, idx) => {
            const itemDiv = document.createElement('div');
            let statusClass = r.status === 'OK' ? 'ok' : (r.status === 'KORRIGIERT' ? 'fixed' : 'nok');
            itemDiv.className = `result-item ${statusClass}`;
            
            let statusText = r.status;
            if (r.status === 'KORRIGIERT') statusText = '🟢 KORRIGIERT (OK)';

            itemDiv.innerHTML = `
                <div><strong>${idx + 1}. ${r.item}</strong> - <span>${statusText}</span></div>
                ${r.note ? `<small style="color: var(--primary); margin-top: 2px;">💬 Kommentar: ${r.note}</small>` : ''}
                ${r.remark ? `<small style="color: var(--red); margin-top: 3px;">⚠️ Mangel: ${r.remark}</small>` : ''}
                ${r.fixNote ? `<small style="color: var(--green); margin-top: 3px;">✅ Nachbesserung: ${r.fixNote}</small>` : ''}
                ${r.status === 'NOK' ? `<button class="btn-fix" onclick="fixItemCurrent(${idx})">🛠️ Mangel beheben & freigeben</button>` : ''}
            `;
            resultsList.appendChild(itemDiv);
        });
    }

    function fixItemCurrent(index) {
        const fixNote = prompt("Bitte beschreiben, wie der Mangel behoben wurde (z.B. 'Schraube nachgezogen'):");
        if (!fixNote) return;

        inspectionResults[index].status = 'KORRIGIERT';
        inspectionResults[index].fixNote = fixNote;
        renderFinalScreen();
    }

    function fixItemArchive(index) {
        if (!selectedArchiveItem) return;
        const fixNote = prompt("Bitte beschreiben, wie der Mangel behoben wurde (z.B. 'Teil ausgetauscht'):");
        if (!fixNote) return;

        selectedArchiveItem.results[index].status = 'KORRIGIERT';
        selectedArchiveItem.results[index].fixNote = fixNote;

        const totalCount = selectedArchiveItem.results.length;
        const okCount = selectedArchiveItem.results.filter(r => r.status === 'OK' || r.status === 'KORRIGIERT').length;
        const nokCount = totalCount - okCount;
        const successRate = totalCount > 0 ? Math.round((okCount / totalCount) * 100) : 0;

        selectedArchiveItem.okCount = okCount;
        selectedArchiveItem.nokCount = nokCount;
        selectedArchiveItem.successRate = successRate;
        selectedArchiveItem.status = nokCount === 0 ? "FREIGEGEBEN" : "NICHT FREIGEGEBEN";

        saveArchiveToFirebase();
        viewArchiveDetail(selectedArchiveItem.id);
    }

    function saveInspection() {
        const worker = document.getElementById('worker-name').value.trim();
        const inspector = document.getElementById('inspector-name').value.trim();
        const date = document.getElementById('inspection-date').value;

        if (!worker || !inspector) { alert("Bitte Monteur und Prüfer eintragen."); return; }

        const archivedItem = {
            ...currentOrder,
            worker,
            inspector,
            date,
            results: inspectionResults,
            completedAt: new Date().toLocaleString('de-DE')
        };

        window.archive.unshift(archivedItem);
        saveArchiveToFirebase();

        window.orders = window.orders.filter(o => o.id !== currentOrder.id);
        saveOrdersToFirebase();

        alert("Prüfung gespeichert und archiviert!");
        goToScreen('screen-home');
    }

    function renderArchive(filteredData = null) {
        const container = document.getElementById('archive-list');
        container.innerHTML = '';

        const dataToRender = filteredData || window.archive;

        if (dataToRender.length === 0) {
            container.innerHTML = '<p style="text-align:center; color: var(--gray);">Keine passenden Protokolle gefunden.</p>';
            return;
        }

        dataToRender.forEach(item => {
            const div = document.createElement('div');
            div.className = 'order-card';
            
            const isOk = item.status === 'FREIGEGEBEN';
            const rate = item.successRate !== undefined ? item.successRate : (isOk ? 100 : 0);
            
            let badgeClass = 'badge-green';
            if (rate < 100 && rate >= 80) badgeClass = 'badge-yellow';
            if (rate < 80) badgeClass = 'badge-red';

            div.innerHTML = `
                <div style="flex: 1; margin-right: 10px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <strong>Auftrag-Nr: ${item.orderNo} - ${item.type}</strong>
                        <span class="badge-status ${badgeClass}">${rate}% OK</span>
                    </div>
                    <small style="color: var(--gray);">SN: ${item.serial} | Datum: ${item.date} | Monteur: ${item.worker}</small>
                    <div class="progress-bar-container" style="height: 5px; margin: 6px 0 0 0;">
                        <div class="progress-bar" style="width: ${rate}%; background-color: ${rate === 100 ? 'var(--green)' : (rate >= 80 ? 'var(--yellow)' : 'var(--red)')};"></div>
                    </div>
                </div>
                <div style="display: flex; gap: 6px; flex-direction: column;">
                    <button class="btn btn-outline" style="width: auto; padding: 6px 10px; white-space: nowrap;" onclick="viewArchiveDetail(${item.id})">Details 👁️</button>
                    <button class="btn btn-outline-red" style="width: auto; padding: 4px 8px; font-size: 0.8rem;" onclick="deleteArchiveItem(${item.id})">🗑️ Löschen</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function deleteArchiveItem(archiveId) {
        if (confirm("Möchtest du dieses Protokoll wirklich aus dem Archiv löschen?")) {
            window.archive = window.archive.filter(a => a.id !== archiveId);
            saveArchiveToFirebase();
            renderArchive();
        }
    }

    function deleteArchiveDetail() {
        if (!selectedArchiveItem) return;
        if (confirm(`Soll das Protokoll für Auftrag ${selectedArchiveItem.orderNo} (SN: ${selectedArchiveItem.serial}) wirklich dauerhaft gelöscht werden?`)) {
            window.archive = window.archive.filter(a => a.id !== selectedArchiveItem.id);
            saveArchiveToFirebase();
            alert("Protokoll gelöscht!");
            goToScreen('screen-archive');
        }
    }

    function filterArchive() {
        const query = document.getElementById('archive-search').value.toLowerCase().trim();
        if (!query) {
            renderArchive(window.archive);
            return;
        }

        const filtered = window.archive.filter(item => {
            return (item.orderNo && item.orderNo.toLowerCase().includes(query)) ||
                   (item.serial && item.serial.toLowerCase().includes(query)) ||
                   (item.type && item.type.toLowerCase().includes(query)) ||
                   (item.worker && item.worker.toLowerCase().includes(query)) ||
                   (item.inspector && item.inspector.toLowerCase().includes(query)) ||
                   (item.date && item.date.includes(query));
        });

        renderArchive(filtered);
    }

    function viewArchiveDetail(id) {
        selectedArchiveItem = window.archive.find(a => a.id === id);
        if (!selectedArchiveItem) return;

        const isOk = selectedArchiveItem.status === 'FREIGEGEBEN';
        const rate = selectedArchiveItem.successRate !== undefined ? selectedArchiveItem.successRate : (isOk ? 100 : 0);
        const banner = document.getElementById('archive-detail-banner');
        
        banner.innerText = isOk ? `🟢 MASCHINE FREIGEGEBEN (${rate}% OK)` : `🔴 MASCHINE NICHT FREIGEGEBEN (${rate}% OK)`;
        banner.style.backgroundColor = isOk ? "var(--green)" : "var(--red)";

        let barColor = rate === 100 ? 'var(--green)' : (rate >= 80 ? 'var(--yellow)' : 'var(--red)');

        document.getElementById('archive-detail-info').innerHTML = `
            <b>Auftrags-Nr:</b> ${selectedArchiveItem.orderNo}<br>
            <b>Typ:</b> ${selectedArchiveItem.type} | <b>SN:</b> ${selectedArchiveItem.serial}<br>
            <b>Spezifikation:</b> Rohrlänge ${selectedArchiveItem.pipe} | Achse: ${selectedArchiveItem.axis} | Motor: ${selectedArchiveItem.kw}<br>
            ${selectedArchiveItem.comment ? `<b>Hinweis:</b> ${selectedArchiveItem.comment}<br>` : ''}
            <hr style="margin: 8px 0; border: 0.5px solid var(--border-color);">
            <b>Monteur:</b> ${selectedArchiveItem.worker} | <b>Prüfer:</b> ${selectedArchiveItem.inspector}<br>
            <b>Datum:</b> ${selectedArchiveItem.date}<br>
            <b>Erfolgsquote:</b> ${rate}% OK (${selectedArchiveItem.okCount || '-'} von ${selectedArchiveItem.totalCount || '-'} OK)
            <div class="progress-bar-container" style="height: 6px; margin-top: 6px;">
                <div class="progress-bar" style="width: ${rate}%; background-color: ${barColor};"></div>
            </div>
        `;

        const resultsContainer = document.getElementById('archive-detail-results');
        resultsContainer.innerHTML = '<h4>Prüfpunkte:</h4>';

        selectedArchiveItem.results.forEach((r, idx) => {
            const itemDiv = document.createElement('div');
            let statusClass = r.status === 'OK' ? 'ok' : (r.status === 'KORRIGIERT' ? 'fixed' : 'nok');
            itemDiv.className = `result-item ${statusClass}`;

            let statusText = r.status;
            if (r.status === 'KORRIGIERT') statusText = '🟢 KORRIGIERT (OK)';

            itemDiv.innerHTML = `
                <div><strong>${idx + 1}. ${r.item}</strong> - <span>${statusText}</span></div>
                ${r.note ? `<small style="color: var(--primary); margin-top: 2px;">💬 Kommentar: ${r.note}</small>` : ''}
                ${r.remark ? `<small style="color: var(--red); margin-top: 3px;">⚠️ Mangel: ${r.remark}</small>` : ''}
                ${r.fixNote ? `<small style="color: var(--green); margin-top: 3px;">✅ Nachbesserung: ${r.fixNote}</small>` : ''}
                ${r.status === 'NOK' ? `<button class="btn-fix" onclick="fixItemArchive(${idx})">🛠️ Mangel beheben & freigeben</button>` : ''}
            `;
            resultsContainer.appendChild(itemDiv);
        });

        goToScreen('screen-archive-detail');
    }

    function printFinalInspection() {
        appendPrintDetails('final-summary', 'worker-name', 'inspector-name', 'inspection-date');
        window.print();
    }

    function printArchiveInspection() {
        window.print();
    }

    function appendPrintDetails(summaryId, workerId, inspectorId, dateId) {
        const worker = document.getElementById(workerId).value.trim() || 'Nicht angegeben';
        const inspector = document.getElementById(inspectorId).value.trim() || 'Nicht angegeben';
        const date = document.getElementById(dateId).value || 'Nicht angegeben';

        let printDetails = document.getElementById('print-summary-extension');
        if (!printDetails) {
            printDetails = document.createElement('div');
            printDetails.id = 'print-summary-extension';
            document.getElementById(summaryId).appendChild(printDetails);
        }

        printDetails.innerHTML = `
            <hr style="margin: 8px 0; border: 0.5px solid var(--border-color);">
            <b>👷 Monteur:</b> ${worker}<br>
            <b>👤 Endkontrolle:</b> ${inspector}<br>
            <b>📅 Datum:</b> ${date}
        `;
    }

    function sendMailCurrent() {
        const worker = document.getElementById('worker-name').value.trim() || 'Unbekannt';
        const inspector = document.getElementById('inspector-name').value.trim() || 'Unbekannt';
        const date = document.getElementById('inspection-date').value;

        generateAndSendMail(currentOrder, inspectionResults, worker, inspector, date);
    }

    function sendMailArchive() {
        if (!selectedArchiveItem) return;
        generateAndSendMail(
            selectedArchiveItem, 
            selectedArchiveItem.results, 
            selectedArchiveItem.worker, 
            selectedArchiveItem.inspector, 
            selectedArchiveItem.date
        );
    }

    function generateAndSendMail(order, results, worker, inspector, date) {
        const rate = order.successRate !== undefined ? order.successRate : (order.status === 'FREIGEGEBEN' ? 100 : 0);
        const subject = encodeURIComponent(`Prüfprotokoll Auftr-Nr: ${order.orderNo} (${rate}% OK): ${order.type} - SN: ${order.serial}`);
        
        let body = `PRÜFPROTOKOLL MASCHINENPRÜFUNG\n-----------------------------------\n`;
        body += `Auftrags-Nr: ${order.orderNo}\n`;
        body += `Typ: ${order.type}\nSeriennummer: ${order.serial}\n`;
        body += `Rohrlänge: ${order.pipe}\nAchse: ${order.axis}\nMotor: ${order.kw}\n`;
        if (order.comment) body += `Werkstatt-Hinweis: ${order.comment}\n`;
        body += `Monteur: ${worker}\nPrüfer: ${inspector}\nDatum: ${date}\n`;
        body += `Ergebnis: ${order.status} (${rate}% OK)\n\nPRÜFERGEBNISSE:\n`;

        results.forEach((r, i) => {
            if (!r) return;
            let line = `${i+1}. ${r.item}: ${r.status}`;
            if (r.note) line += ` (Hinweis: ${r.note})`;
            if (r.remark) line += ` (Mangel: ${r.remark})`;
            if (r.fixNote) line += ` [Nachbesserung: ${r.fixNote}]`;
            body += line + `\n`;
        });

        window.location.href = `mailto:?subject=${subject}&body=${encodeURIComponent(body)}`;
    }

    const itemTranslations = {
        "Zwischenlager montiert": "Paliers intermédiaires montés",
        "Zwischenlager geprüft": "Paliers intermédiaires contrôlés",
        "Flanschlager festgezogen": "Roulement à bride serré",
        "Madenschrauben an Flanschlager festgezogen": "Vis sans tête du roulement à bride serrées",
        "Gleitlagerkopf angezogen": "Tête de palier lisse serrée",
        "Schmierleitung festgezogen": "Conduit de graissage serré",
        "Öl eingesetzt / aufgefüllt": "Huile ajoutée / remplie",
        "Ring montiert": "Anneau monté",
        "Flügel montiert": "Pales montées",
        "Flügel mit Kiloschlüssel festgezogen": "Pales serrées à la clé dynamométrique",
        "Ring exakt ausgerichtet": "Anneau aligné avec précision",
        "Gummis montiert": "Joints en caoutchouc montés",
        "Motorkiste montiert & festgezogen": "Caisson moteur monté et serré",
        "Motor montiert & festgezogen": "Moteur monté et serré",
        "Keilriemen auf Spannung & Sitz geprüft": "Tension et assise de la courroie contrôlées",
        "Riemenscheiben festgezogen": "Poulies serrées",
        "Schaltkasten auf Funktion getestet": "Boîtier de commande testé",
        "Kabel & Anschlüsse geprüft": "Câbles et raccordements contrôlés",
        "Maschinen-Testlauf durchgeführt": "Test de fonctionnement de la machine effectué",
        "Hauben montiert & festgezogen": "Capots montés et serrés",
        "Spanner verpackt / beigelegt": "Tendeur emballé / joint",
        "Deckelsatz-System verpackt": "Jeu de couvercles emballé",
        "Schrauben für Deckelsatz beigelegt": "Vis pour le jeu de couvercles jointes",
        "Typenschild geklebt": "Plaque signalétique collée",
        "Optische Sauberkeit der Maschine geprüft": "Propreté visuelle de la machine contrôlée",
        "Alle erforderlichen Aufkleber vorhanden & korrekt angebracht": "Toutes les étiquettes présentes et correctement posées",
        "Maschine komplett eingepackt inkl. Flügel": "Machine entièrement emballée avec pales"
    };

    function translateCheckItem(itemText) {
        if (currentLang === 'fr' && itemTranslations[itemText]) {
            return itemTranslations[itemText];
        }
        return itemText;
    }
</script>
