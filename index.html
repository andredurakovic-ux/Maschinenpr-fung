
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitale Maschinenprüfung - Baugruppen</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #1a202c;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --green: #10b981;
            --green-hover: #059669;
            --red: #ef4444;
            --red-hover: #dc2626;
            --gray: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 { font-size: 1.5rem; }
        h2 { font-size: 1.2rem; margin-bottom: 10px; }

        .screen {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .screen.active { display: flex; }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn-green { background-color: var(--green); }
        .btn-green:hover { background-color: var(--green-hover); }
        .btn-red { background-color: var(--red); }
        .btn-secondary { background-color: var(--gray); }
        .btn-outline { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #4a5568;
        }

        input, select, textarea {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
        }

        /* Checkbox-Karten für Baugruppen */
        .checkbox-group {
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        .info-card {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .check-item-card {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: #fff;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .action-buttons .btn { flex: 1; padding: 18px; font-size: 1.2rem; }

        .order-card {
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }

        @media print {
            body { background: white; padding: 0; }
            .app-container { box-shadow: none; border: none; max-width: 100%; }
            header, .btn, input, select, textarea, .progress-bar-container, .action-buttons { display: none !important; }
            .screen { display: block !important; }
            #screen-final { display: block !important; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🏭 Maschinenprüfung & Baugruppen</h1>
    </header>

    <!-- 1. HAUPTMENÜ -->
    <div id="screen-home" class="screen active">
        <button class="btn" onclick="goToScreen('screen-new-order')">➕ Neuen Auftrag anlegen (Büro)</button>
        <button class="btn btn-green" onclick="goToScreen('screen-orders')">🛠️ Werkstatt / Offene Aufträge</button>
    </div>

    <!-- 2. AUFTRAG ANLEGEN (BÜRO) -->
    <div id="screen-new-order" class="screen">
        <h2>Auftrag & Baugruppen konfigurieren</h2>
        
        <div class="form-group">
            <label>Maschinentyp</label>
            <input type="text" id="order-type" value="FER415S583A385">
        </div>
        <div class="form-group">
            <label>Seriennummer</label>
            <input type="text" id="order-serial" value="FER00487">
        </div>

        <!-- Baugruppe 1 Optionen -->
        <div class="form-group">
            <label>Rohrlänge (Baugruppe 1)</label>
            <select id="order-pipe">
                <option value="300 cm">300 cm</option>
                <option value="400 cm" selected>400 cm</option>
                <option value="425 cm">425 cm</option>
                <option value="450 cm">450 cm</option>
                <option value="475 cm">475 cm</option>
                <option value="500 cm">500 cm</option>
                <option value="600 cm">600 cm</option>
                <option value="700 cm">700 cm</option>
            </select>
        </div>
        <div class="form-group">
            <label>Bestimmte Achse (Baugruppe 1)</label>
            <input type="text" id="order-axis" placeholder="z. B. Achse Typ A-400">
        </div>

        <hr style="border: 0.5px solid var(--border-color); margin: 5px 0;">
        <label><b>Zusätzliche Baugruppen wählen:</b></label>

        <label class="checkbox-group">
            <input type="checkbox" id="bg-fluegel" checked>
            <div><b>Baugruppe 2:</b> Flügel, Ring & Gummis</div>
        </label>

        <label class="checkbox-group">
            <input type="checkbox" id="bg-motor" checked onchange="toggleMotorKwInput()">
            <div><b>Baugruppe 3:</b> Antrieb & Motorkiste</div>
        </label>
        
        <div class="form-group" id="kw-group" style="margin-left: 20px;">
            <label>Motor-Leistung (kW)</label>
            <input type="text" id="order-kw" value="5.5 kW">
        </div>

        <label class="checkbox-group">
            <input type="checkbox" id="bg-elektrik" checked>
            <div><b>Baugruppe 4:</b> Elektrik & Testlauf</div>
        </label>

        <label class="checkbox-group">
            <input type="checkbox" id="bg-zubehoer" checked>
            <div><b>Baugruppe 5:</b> Zubehör, Verpackung & Optik</div>
        </label>

        <button class="btn btn-green" onclick="createOrder()">Auftrag für Werkstatt freigeben ▶</button>
        <button class="btn btn-secondary" onclick="goToScreen('screen-home')">Abbrechen</button>
    </div>

    <!-- 3. AUFTRAGSLISTE (WERKSTATT) -->
    <div id="screen-orders" class="screen">
        <h2>Offene Aufträge (Werkstatt)</h2>
        <div id="orders-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
        <button class="btn btn-secondary" onclick="goToScreen('screen-home')" style="margin-top: 10px;">Zurück</button>
    </div>

    <!-- 4. PRÜFUNG DURCHFÜHREN (MONTEUR) -->
    <div id="screen-inspection" class="screen">
        <div class="info-card" id="inspection-info"></div>
        
        <div>
            <div style="display: flex; justify-content: space-between; font-weight: bold;">
                <span>Fortschritt</span>
                <span id="progress-text">0 / 0</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="check-item-card">
            <h3 id="check-step">Prüfpunkt</h3>
            <p id="check-text" style="font-size: 1.2rem; font-weight: bold; margin-top: 10px;">-</p>
        </div>

        <div id="remark-container" class="form-group" style="display: none;">
            <label for="remark-text" style="color: var(--red);">🔴 Mangel beschreiben:</label>
            <textarea id="remark-text" placeholder="Beschreibung des Fehlers..."></textarea>
            <button class="btn btn-red" onclick="confirmNOK()">Mangel speichern & Weiter</button>
        </div>

        <div class="action-buttons" id="main-actions">
            <button class="btn btn-green" onclick="handleCheck(true)">🟢 OK</button>
            <button class="btn btn-red" onclick="showRemarkInput()">🔴 NICHT OK</button>
        </div>
    </div>

    <!-- 5. ENDKONTROLLE & EXPORT -->
    <div id="screen-final" class="screen">
        <h2>Endkontrolle & Abschluss</h2>
        <div id="final-result-banner" style="text-align: center; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; color: white;"></div>

        <div class="info-card" id="final-summary"></div>

        <div class="form-group">
            <label>👷 Mitarbeiter / Monteur</label>
            <input type="text" id="worker-name" placeholder="Name des Monteurs">
        </div>
        <div class="form-group">
            <label>👤 Endkontrolle durchgeführt von</label>
            <input type="text" id="inspector-name" placeholder="Name des Prüfers">
        </div>
        <div class="form-group">
            <label>📅 Datum</label>
            <input type="date" id="inspection-date">
        </div>

        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" onclick="window.print()">🖨️ Drucken / PDF</button>
            <button class="btn btn-outline" onclick="sendMail()">✉️ Mail senden</button>
        </div>

        <button class="btn btn-green" onclick="saveInspection()">Prüfung Speichern 💾</button>
    </div>
</div>

<script>
    // Aktualisierte Baugruppen-Definitionen
    const masterChecklist = {
        bg1: [
            "Zwischenlager montiert & geprüft.",
            "Flanschlager (inkl. Madenschrauben) festgezogen.",
            "Gleitlagerkopf angezogen.",
            "Schmierleitung festgezogen.",
            "Öl eingesetzt."
        ],
        bg2: [
            "Flügel mit Kiloschlüssel festgezogen.",
            "Ring montiert & ausgerichtet.",
            "Gummis montiert."
        ],
        bg3: [
            "Motorkiste festgezogen.",
            "Motor festgezogen.",
            "Keilriemen und Riemenscheiben festgezogen."
        ],
        bg4: [
            "Schaltkasten getestet.",
            "Maschinen-Testlauf durchgeführt."
        ],
        bg5: [
            "Haube festgezogen.",
            "Spanner verpackt.",
            "Deckelsatz-System (inkl. Schrauben) verpackt.",
            "Typenschild geklebt.",
            "Sauberkeit geprüft.",
            "Alle erforderlichen Aufkleber vorhanden und korrekt angebracht?"
        ]
    };

    let orders = JSON.parse(localStorage.getItem('machine_orders') || '[]');
    let currentOrder = null;
    let activeChecklist = [];
    let currentStep = 0;
    let inspectionResults = [];

    function goToScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if (screenId === 'screen-orders') renderOrders();
    }

    function toggleMotorKwInput() {
        const isChecked = document.getElementById('bg-motor').checked;
        document.getElementById('kw-group').style.display = isChecked ? 'flex' : 'none';
    }

    // Auftrag erstellen
    function createOrder() {
        const newOrder = {
            id: Date.now(),
            type: document.getElementById('order-type').value.trim(),
            serial: document.getElementById('order-serial').value.trim(),
            pipe: document.getElementById('order-pipe').value,
            axis: document.getElementById('order-axis').value.trim() || 'Standard-Achse',
            bg2: document.getElementById('bg-fluegel').checked,
            bg3: document.getElementById('bg-motor').checked,
            kw: document.getElementById('bg-motor').checked ? document.getElementById('order-kw').value : 'Keine Motorkiste',
            bg4: document.getElementById('bg-elektrik').checked,
            bg5: document.getElementById('bg-zubehoer').checked,
            status: 'OFFEN'
        };

        orders.push(newOrder);
        localStorage.setItem('machine_orders', JSON.stringify(orders));
        alert('Auftrag erfolgreich für die Werkstatt angelegt!');
        goToScreen('screen-orders');
    }

    // Aufträge rendern
    function renderOrders() {
        const container = document.getElementById('orders-list');
        container.innerHTML = '';

        if (orders.length === 0) {
            container.innerHTML = '<p style="text-align:center; color: var(--gray);">Keine offenen Aufträge.</p>';
            return;
        }

        orders.forEach(o => {
            const div = document.createElement('div');
            div.className = 'order-card';
            div.innerHTML = `
                <div>
                    <strong>${o.type}</strong> (SN: ${o.serial})<br>
                    <small>Rohr: ${o.pipe} | Achse: ${o.axis} | Motor: ${o.kw}</small>
                </div>
                <button class="btn btn-green" style="width: auto; padding: 8px 12px;" onclick="startInspection(${o.id})">Starten ▶</button>
            `;
            container.appendChild(div);
        });
    }

    // Prüfung starten
    function startInspection(orderId) {
        currentOrder = orders.find(o => o.id === orderId);
        activeChecklist = [...masterChecklist.bg1];

        if (currentOrder.bg2) activeChecklist.push(...masterChecklist.bg2);
        if (currentOrder.bg3) activeChecklist.push(...masterChecklist.bg3);
        if (currentOrder.bg4) activeChecklist.push(...masterChecklist.bg4);
        if (currentOrder.bg5) activeChecklist.push(...masterChecklist.bg5);

        currentStep = 0;
        inspectionResults = [];

        document.getElementById('inspection-info').innerHTML = `
            <b>Typ:</b> ${currentOrder.type} | <b>SN:</b> ${currentOrder.serial}<br>
            <b>Spezifikation:</b> Rohrlänge ${currentOrder.pipe} | Achse: ${currentOrder.axis} | Motor: ${currentOrder.kw}
        `;

        updateStepView();
        goToScreen('screen-inspection');
    }

    function updateStepView() {
        const total = activeChecklist.length;
        document.getElementById('progress-text').innerText = `${currentStep} / ${total}`;
        document.getElementById('progress-bar').style.width = `${(currentStep / total) * 100}%`;

        if (currentStep < total) {
            document.getElementById('check-step').innerText = `Prüfpunkt ${currentStep + 1} von ${total}`;
            document.getElementById('check-text').innerText = activeChecklist[currentStep];
            document.getElementById('remark-container').style.display = 'none';
            document.getElementById('main-actions').style.display = 'flex';
            document.getElementById('remark-text').value = '';
        } else {
            finishInspection();
        }
    }

    function handleCheck(isOk) {
        if (isOk) {
            inspectionResults.push({ item: activeChecklist[currentStep], status: 'OK', remark: '' });
            currentStep++;
            updateStepView();
        }
    }

    function showRemarkInput() {
        document.getElementById('main-actions').style.display = 'none';
        document.getElementById('remark-container').style.display = 'flex';
    }

    function confirmNOK() {
        const remark = document.getElementById('remark-text').value.trim();
        if (!remark) { alert("Bitte Mangel beschreiben."); return; }
        inspectionResults.push({ item: activeChecklist[currentStep], status: 'NOK', remark: remark });
        currentStep++;
        updateStepView();
    }

    function finishInspection() {
        const hasErrors = inspectionResults.some(r => r.status === 'NOK');
        const banner = document.getElementById('final-result-banner');

        currentOrder.status = hasErrors ? "NICHT FREIGEGEBEN" : "FREIGEGEBEN";

        if (hasErrors) {
            banner.innerText = "🔴 MASCHINE NICHT FREIGEGEBEN";
            banner.style.backgroundColor = "var(--red)";
        } else {
            banner.innerText = "🟢 MASCHINE FREIGEGEBEN";
            banner.style.backgroundColor = "var(--green)";
        }

        document.getElementById('final-summary').innerHTML = `
            <b>Typ:</b> ${currentOrder.type} | <b>SN:</b> ${currentOrder.serial}<br>
            <b>Rohrlänge:</b> ${currentOrder.pipe} | <b>Achse:</b> ${currentOrder.axis}<br>
            <b>Motor:</b> ${currentOrder.kw}
        `;

        document.getElementById('inspection-date').value = new Date().toISOString().split('T')[0];
        goToScreen('screen-final');
    }

    function saveInspection() {
        const worker = document.getElementById('worker-name').value.trim();
        const inspector = document.getElementById('inspector-name').value.trim();
        if (!worker || !inspector) { alert("Bitte Monteur und Prüfer eintragen."); return; }

        orders = orders.filter(o => o.id !== currentOrder.id);
        localStorage.setItem('machine_orders', JSON.stringify(orders));

        alert("Prüfung erfolgreich gespeichert!");
        goToScreen('screen-home');
    }

    function sendMail() {
        const worker = document.getElementById('worker-name').value.trim() || 'Unbekannt';
        const inspector = document.getElementById('inspector-name').value.trim() || 'Unbekannt';
        const date = document.getElementById('inspection-date').value;

        const subject = encodeURIComponent(`Prüfprotokoll: ${currentOrder.type} - SN: ${currentOrder.serial}`);
        let body = `PRÜFPROTOKOLL MASCHINENPRÜFUNG\n-----------------------------------\n`;
        body += `Typ: ${currentOrder.type}\nSeriennummer: ${currentOrder.serial}\n`;
        body += `Rohrlänge: ${currentOrder.pipe}\nAchse: ${currentOrder.axis}\nMotor: ${currentOrder.kw}\n`;
        body += `Monteur: ${worker}\nPrüfer: ${inspector}\nDatum: ${date}\nErgebnis: ${currentOrder.status}\n\nPRÜFERGEBNISSE:\n`;

        inspectionResults.forEach((r, i) => {
            body += `${i+1}. ${r.item}: ${r.status}${r.remark ? ' (' + r.remark + ')' : ''}\n`;
        });

        window.location.href = `mailto:?subject=${subject}&body=${encodeURIComponent(body)}`;
    }
</script>
</body>
</html>
